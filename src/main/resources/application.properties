## base application.properties file

# use dev profile if no other profile is active
spring.profiles.active=dev

# database config
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.url=jdbc:h2:mem:skel
spring.datasource.user=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create
spring.h2.console.enabled=true
spring.jpa.defer-datasource-initialization=true

# rest config
cors.allowed-origins=http://localhost:3000,https://localhost:3000,localhost:3000
cors.allowed-methods=*
cors.allowed-headers=*
cors.allow-credentials=true
cors.max-age=1800
# error messages
server.error.include-message=always
# JWT Properties
app.jwt.secret=${APP_JWT_SECRET:local-dev-jwt-secret-change-me}
# 24h (for dev purposes)
app.jwt.expirationMs=86400000
# important: whitespace at end part of prefix!
app.jwt.token.prefix=Bearer 
app.jwt.token.header=Authorization
app.jwt.token.type=JWT
app.jwt.token.issuer=skel-api
app.jwt.token.audience=skel-ui
app.jwt.login.url=/authentication/login

# mail delivery properties
app.mail.smtp.host=${APP_MAIL_SMTP_HOST:}
app.mail.smtp.port=${APP_MAIL_SMTP_PORT:587}
app.mail.smtp.username=${APP_MAIL_SMTP_USERNAME:}
app.mail.smtp.password=${APP_MAIL_SMTP_PASSWORD:}
app.mail.smtp.starttls.enable=${APP_MAIL_SMTP_STARTTLS_ENABLE:true}
