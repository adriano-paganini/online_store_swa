services:
  app:
    build: .
    image: skel-app
    container_name: "${TEAM_NAME:-local}-app"
    ports:
      - "${HOST_PORT:-8080}:8080"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      APP_JWT_SECRET: "${APP_JWT_SECRET}"
      APP_MAIL_SMTP_HOST: "${APP_MAIL_SMTP_HOST}"
      APP_MAIL_SMTP_PORT: "${APP_MAIL_SMTP_PORT:-587}"
      APP_MAIL_SMTP_USERNAME: "${APP_MAIL_SMTP_USERNAME}"
      APP_MAIL_SMTP_PASSWORD: "${APP_MAIL_SMTP_PASSWORD}"
      APP_MAIL_SMTP_STARTTLS_ENABLE: "${APP_MAIL_SMTP_STARTTLS_ENABLE:-true}"
    restart: unless-stopped
